<style>

<body class="bg-background text-on-background font-body-sm text-body-sm h-screen w-screen overflow-hidden flex flex-col relative selection:bg-primary-container selection:text-on-primary-container">

<img alt="صورة الطفل" class="w-full h-full object-cover" data-alt="cute cartoon avatar of a child with smiling face and bright background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDIcg_M2ZbIOPLdCbq-WtouUHfs4AeUQ1MfWfSuaA--AXqrKPAs_K3EoEUMWoX1x8ANuWcIP-9rWsCU7Dws_hPApfmfm5sPQNYwSkDPIdNOKh8Z-yJjxRXCSgelAPxTNkdLUHY8Rxd2q2rIkKKo4bMarqE6Vp_OPfVKne7OzpHkmWttIGu2fkI17RGVPCFLlvTXMqVQoQtccihJQCUN-lWzj0CbPLzmEo-5Y0DAzOqH1K7QyD6wqoS3qd--C2OhjKOequS2ULCDcoQ"/>
</div>
<!-- Headline -->
<h1 class="font-['Plus_Jakarta_Sans'] font-black text-xl text-[#40B5E8]">عالم الاكتشاف</h1>
<!-- Trailing: Action -->
<button class="bg-white dark:bg-slate-800 rounded-full px-4 py-2 flex items-center gap-1 font-label-bold text-label-bold text-secondary-container shadow-sm border-b-4 border-surface-variant active:translate-y-1 active:border-b-0 transition-all shrink-0">
<span>⭐</span>
<span class="mt-1">120</span>
</button>
</header>
<!-- Main Game Canvas -->
<main class="flex-1 w-full h-full flex flex-col items-center justify-center relative pt-24 pb-28 px-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-surface-bright via-background to-surface-container-low">
<!-- Back Button (Contextual for Game Screen) -->
<div class="absolute top-24 right-4 z-10">
<button aria-label="رجوع" class="w-12 h-12 rounded-full bg-white border-b-4 border-outline-variant shadow-sm flex items-center justify-center text-outline hover:scale-105 active:translate-y-1 active:border-b-0 transition-all">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'wght' 600;">arrow_forward</span>
</button>
</div>
<!-- Image Tile (The Bee) -->
<div class="relative w-48 h-48 md:w-56 md:h-56 rounded-[2rem] bg-white border-[3px] border-surface-variant shadow-[0_12px_32px_rgba(64,181,232,0.15)] p-3 mb-6 transform hover:scale-105 transition-transform duration-300">
<div class="w-full h-full rounded-2xl overflow-hidden bg-primary-fixed/20 flex items-center justify-center">
<img alt="نحلة" class="w-full h-full object-cover mix-blend-multiply" data-alt="vibrant, highly detailed 3d cartoon illustration of a cute, friendly bumblebee with big eyes, flying in a sunlit meadow, bright inviting colors" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAYOFTB61N8AQe0srZHI4mBBThVT-XBtreGMV80HUAVQdkzhvAJqjvmvPHQPhJAJnEA7gICQDFSPNIBYsCpfCqLfS4RukjlvRbzWV2EaSXnE2G1TifNYypbqg3R0etiQHC1AaZ-JfalIfIPSMxWJQtZ819ETzhu83DMmuxJoP37Cz8pJ71dDIW7rbhJMpMv2RGBWGG0SPmihK3Z_SdLIGtFh_XFZhCk7eSyqIhsLkt11YULuV3-tOrZV9x6YS9HXKKNNyMv5Zr_Eoo"/>
</div>
<!-- Decorative sparkle -->
<div class="absolute -top-3 -right-3 text-secondary-container text-3xl animate-bounce">✨</div>
</div>
<!-- Word Puzzle Container -->
<div class="flex flex-row items-center justify-center gap-2 md:gap-4 bg-white px-6 py-5 rounded-[2.5rem] border-b-[6px] border-surface-variant shadow-inner mb-10 min-w-[280px]">
<!-- Right-most letter (N) -->
<div class="w-14 h-16 flex items-center justify-center">
<span class="font-display-lg text-display-lg text-primary select-none mt-2">ن</span>
</div>
<!-- Missing Letter Slot -->
<div class="w-16 h-16 rounded-[1.5rem] bg-surface-container-highest border-4 border-dashed border-outline-variant shadow-inner flex items-center justify-center mx-1">
<span class="w-6 h-1 bg-outline rounded-full opacity-50"></span>
</div>
<!-- Next letter (L) -->
<div class="w-14 h-16 flex items-center justify-center">
<span class="font-display-lg text-display-lg text-primary select-none mt-2">ل</span>
</div>
<!-- Left-most letter (Tamarbuta) -->
<div class="w-14 h-16 flex items-center justify-center">
<span class="font-display-lg text-display-lg text-primary select-none mt-2">ة</span>
</div>
</div>
<!-- Interactive Choices (Bubbles) -->
<div class="flex flex-row items-end justify-center gap-6 md:gap-10 w-full px-4">
<!-- Incorrect Choice 1 -->
<button class="relative w-20 h-20 rounded-full bg-secondary-container border-b-[8px] border-[#c9a630] shadow-[0_8px_0_0_#c9a630,0_15px_20px_rgba(252,208,61,0.4)] active:translate-y-[8px] active:shadow-[0_0px_0_0_#c9a630,0_5px_10px_rgba(252,208,61,0.4)] active:border-b-0 transition-all flex items-center justify-center group touch-manipulation">
<div class="absolute inset-2 rounded-full bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="font-display-lg text-display-lg text-on-secondary-container mt-2">م</span>
</button>
<!-- Correct Choice -->
<button class="relative w-24 h-24 rounded-full bg-tertiary-container border-b-[10px] border-[#4a9655] shadow-[0_10px_0_0_#4a9655,0_20px_25px_rgba(93,189,107,0.4)] active:translate-y-[10px] active:shadow-[0_0px_0_0_#4a9655,0_8px_15px_rgba(93,189,107,0.4)] active:border-b-0 transition-all flex items-center justify-center group touch-manipulation z-10 -translate-y-2">
<div class="absolute inset-2 rounded-full bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>

<div class="absolute inset-2 rounded-full bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="font-display-lg text-display-lg text-on-primary-container mt-2">ب</span>
</button>
</div>

<!-- Tab 1: الرئيسية -->
<button class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-600 px-4 py-2 hover:bg-sky-50 dark:hover:bg-slate-800 transition-colors active:scale-90 transition-all duration-150 rounded-2xl w-[72px]">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 0;">home</span>
<span class="font-['Plus_Jakarta_Sans'] font-bold text-[11px] mt-1 whitespace-nowrap">الرئيسية</span>
